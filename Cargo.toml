[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/core",
    "crates/daemon",
    "crates/gui",
    "crates/ipc",
    "crates/platform",
    "crates/protocol",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/H2O-MERO/ntfy-client-gui-for-all"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
arboard = { version = "3.6", default-features = false }
auto-launch = "0.6"
base64 = "0.22"
directories = "6.0"
futures-util = "0.3"
http = "1.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
secrecy = { version = "0.10", features = ["serde"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "compat-1-18"] }
slint-build = { version = "1.18", default-features = false, features = ["compat-1-18"] }
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
webbrowser = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
