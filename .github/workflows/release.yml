name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
      ARTIFACT: ntfy-client-gui-for-all-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target $env:TARGET
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/$env:TARGET/release/ntfy-client-gui-for-all-daemon.exe" dist/
          Copy-Item "target/$env:TARGET/release/ntfy-client-gui-for-all.exe" dist/
          Copy-Item README.md,README.en.md,LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath $env:ARTIFACT
          (Get-FileHash $env:ARTIFACT -Algorithm SHA256).Hash.ToLower() + "  $env:ARTIFACT" | Set-Content -NoNewline "${env:ARTIFACT}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
