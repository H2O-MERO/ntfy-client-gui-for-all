name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ntfy-client-gui-for-all-windows-x86_64.zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: ntfy-client-gui-for-all-linux-x86_64.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: ntfy-client-gui-for-all-macos-aarch64.tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: ntfy-client-gui-for-all-macos-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libx11-xcb-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ntfy-client-gui-for-all-daemon.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/ntfy-client-gui-for-all.exe" dist/
          Copy-Item README.md,README.en.md,LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}"
          (Get-FileHash "${{ matrix.artifact }}" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.artifact }}" | Set-Content -NoNewline "${{ matrix.artifact }}.sha256"
      - if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ntfy-client-gui-for-all-daemon target/${{ matrix.target }}/release/ntfy-client-gui-for-all dist/
          cp packaging/linux/ntfy-client-gui-for-all.desktop README.md README.en.md LICENSE dist/
          cp assets/logo.svg dist/ntfy-client-gui-for-all.svg
          tar -czf "${{ matrix.artifact }}" -C dist .
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - if: runner.os == 'macOS'
        run: |
          app="dist/ntfy-client-gui-for-all.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/${{ matrix.target }}/release/ntfy-client-gui-for-all-daemon target/${{ matrix.target }}/release/ntfy-client-gui-for-all "$app/Contents/MacOS/"
          cp packaging/macos/Info.plist "$app/Contents/"
          cp assets/logo.svg "$app/Contents/Resources/"
          codesign --force --deep --sign - "$app"
          tar -czf "${{ matrix.artifact }}" -C dist "ntfy-client-gui-for-all.app"
          shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
